[package]
name = "mote"
version = "0.1.0"
edition = "2021"
description = "Filesystem triage agent: routes files to their destination and finds duplicates."

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.10"
globset = "0.4.20"
infer = "0.22.0"
jwalk = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.46"
toml = "1.1.6"
zip = { version = "^8", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
