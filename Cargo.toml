[package]
name = "mote"
version = "0.1.0"
edition = "2021"
description = "Filesystem triage agent: routes files to their destination and finds duplicates."

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
